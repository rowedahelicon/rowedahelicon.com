<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{website_title}</title>
        {website_css}
        <link rel="icon" type="image/x-icon" href="{website_url}images/favicon.ico">
        <link rel="apple-touch-icon" sizes="180x180" href="{website_url}images/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="{website_url}images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="{website_url}images/favicon-16x16.png">
        <link rel="manifest" href="{website_url}site.webmanifest">
        <meta charset="UTF-8">
        <meta property="og:title" content="{website_title}">
        <meta property="og:description" content="{website_description}">
        <meta property="og:site_name" content="{website_title}">
        <meta property="og:type" content="profile">
        <meta property="twitter:card" content="summary_large_image">
        <meta property="twitter:site" content="@rowedahelicon">
        <meta property="twitter:image" content="{website_url}images/rowdy_og.png">
        <meta property="og:image" content="{website_url}images/rowdy_og.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:url" content="{website_url}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    </head>
    <body>
        <div id="stars_1"></div>
        <div id="stars_2"></div>
        <div id="stars_3"></div>
        <div id="container" class="container md:mx-auto max-w-screen-lg md:mt-4 md:mb-1 stripes-1 p-2 border-solid border-0 md:border-8 border-black/70">
            {?header.html}
            {website_content}
            {?footer.html}
        </div>
        <div role="contentinfo">
            <div id="quote" class="ui-monospace text-center text-gray-400" style="font-size: 10pt;">"So I believe in a universe that doesn't care and people who do."</div>
            <p class="text-center text-gray-300 text-xs mb-4">
                Made with &lt;3 by <a href="https://rowdythecrux.dev" target="_blank">Rowedahelicon</a> :: Crucis Nexus 227 - <a href="{website_url}revision">Revision: 008 (1/7/2026)</a> :: <a href="https://rowedahelicon.com/colophon">Colophon</a> :: <a href="{website_url}roadmap">Roadmap</a>
            </p>
        </div>
    </body>
</html>
<script>
    const quotes = [
        "So I believe in a universe that doesn't care and people who do.",
        "Your eyes tell me I'm still alive. And no matter what else happens... It's perfect when you're right by my side.",
        "You arrived, a soft slow end of time, saying if all we saw were bright lights, darkness is what we'd try to find.",
        "Are you a failure? Hmm, I don't know. I'm not sure what I was trying to do.",
        "The woods are lovely, dark, and deep. But I have promises to keep, and miles to go before I sleep.",
        "Though my soul may set in darkness, it will rise in perfect light.",
        "I have loved the stars too truly to be fearful of the night.",
        "At the end of everything, hold on to anything.",
        "Nothing is going to save us forever, but a lot of things can save us today.",
        "Live and drink.",
        "You can just do things.",
        "Happiness for everybody, free of charge, and may no one be left behind!",
        "Despite everything, it's still you.",
        "When the power of love beats the love of power, the world knows peace",
        "Today is all we have, party like there is no tomorrow!",
        "Luck is the best thing to have!"

    ];
    quote = Math.floor(Math.random() * quotes.length);
    document.getElementById('quote').innerHTML = `"${quotes[quote]}"`;
</script>
